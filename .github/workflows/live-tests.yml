# Go SDK — Live Tests

name: Live Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:            # run on PRs to any base (feature-branch stacks included)
  workflow_dispatch:
  schedule:
    # Staging canary (MESH-368). The MESHAPI_* secrets already point at staging,
    # so these runs exercise the live staging API on a fixed cadence — independent
    # of whether anyone opened a PR. Two cadences:
    - cron: "29 */2 * * *"   # every 2h — cheap smoke subset (fast outage detection)
    - cron: "0 7 * * *"      # daily 07:00 UTC — full live suite (gates nothing; report-only)

env:
  # Secrets (set in repo → Settings → Secrets and variables → Actions → Secrets)
  MESHAPI_BASE_URL: ${{ secrets.MESHAPI_BASE_URL }}
  MESHAPI_TOKEN: ${{ secrets.MESHAPI_TOKEN }}
  # Core models — safe non-secret defaults.
  MESHAPI_MODEL: "openai/gpt-4o-mini"
  MESHAPI_EMBEDDINGS_MODEL: "openai/text-embedding-3-small"
  MESHAPI_SECOND_MODEL: "anthropic/claude-haiku-4.5"
  MESHAPI_REALTIME_MODEL: "openai/gpt-realtime-mini"
  MESHAPI_IMAGE_URL: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"
  # Feature models — inlined (non-secret). Video generation is intentionally
  # left unset (skips: too costly to run in CI). Strict mode is off.
  MESHAPI_IMAGE_GEN_MODEL: "openai/gpt-image-1"
  MESHAPI_IMAGE_EDIT_MODEL: "openai/gpt-image-1"

jobs:
  live-test:
    name: Go SDK Live Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK source (including tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Go 1.22
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: "1.22"

      # Gating where safe (MESH-368): PRs and pushes run the cheap SMOKE subset
      # (models list, one chat, embeddings, one stream, 401) so they gate
      # reliably green — the full suite includes slow/flaky calls (image
      # generation, realtime WebSocket) that intermittently exceed provider
      # latency and shouldn't block unrelated PRs. The FULL suite still runs,
      # just not as a PR gate: on the daily staging cron and on manual
      # workflow_dispatch (e.g. to investigate or confirm a fix).
      - name: Determine suite mode
        id: mode
        if: always()   # compute even if an earlier step failed, so summary/alert still show the suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "29 */2 * * *" ]; then
              echo "value=smoke" >> "$GITHUB_OUTPUT"
            else
              echo "value=full" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live tests (${{ steps.mode.outputs.value }})
        working-directory: livetests
        # 300s (matches documented local usage): the full live suite now
        # includes the added endpoint tests and exceeds the old 120s cap.
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "smoke" ]; then
            go test -v -timeout 120s -run '^(TestLive_Models_List|TestLive_Models_Free|TestLive_Models_Paid|TestLive_Chat_Create|TestLive_Embeddings_Create|TestLive_Stream_Basic|TestLive_Error_Unauthorized)$' ./...
          else
            go test -v -timeout 300s ./...
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🐹 Go SDK Live Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }}${{ github.event.schedule && format(' (`{0}`)', github.event.schedule) || '' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | ${{ steps.mode.outputs.value }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go | 1.22 |" >> $GITHUB_STEP_SUMMARY
          echo "| Base URL | \`${{ env.MESHAPI_BASE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Model | \`${{ env.MESHAPI_MODEL }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a  # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Go SDK Live Tests* — ${{ job.status }} · ${{ steps.mode.outputs.value }} suite\nTrigger: `${{ github.event_name }}${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}` · Base URL: `${{ env.MESHAPI_BASE_URL }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · ${{ github.head_ref || github.ref_name }}"
            }
